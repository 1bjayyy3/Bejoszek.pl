<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bejoszekpl</title>
<style>
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: black; overflow: hidden;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    /* ===== REALISTYCZNY PRZYCISK (bez napisu) ===== */
    #redButton {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 120px; height: 120px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        outline: none;
        padding: 0;
        background:
            radial-gradient(circle at 30% 25%, #ff8a8a 0%, #e62222 35%, #8b0000 75%, #3a0000 100%);
        box-shadow:
            inset 0 -10px 20px rgba(0,0,0,0.6),
            inset 0 10px 20px rgba(255,255,255,0.25),
            0 12px 25px rgba(0,0,0,0.7),
            0 0 60px rgba(255,0,0,0.5);
        transition: transform 0.08s ease, box-shadow 0.15s ease;
    }

    #redButton::before {
        content: "";
        position: absolute;
        top: 12%; left: 20%;
        width: 45%; height: 30%;
        border-radius: 50%;
        background: radial-gradient(ellipse at center,
                    rgba(255,255,255,0.9) 0%,
                    rgba(255,255,255,0.3) 40%,
                    rgba(255,255,255,0) 70%);
        filter: blur(2px);
        pointer-events: none;
    }

    #redButton::after {
        content: "";
        position: absolute;
        bottom: 10%; left: 25%;
        width: 50%; height: 20%;
        border-radius: 50%;
        background: radial-gradient(ellipse at center,
                    rgba(255,150,150,0.4) 0%,
                    rgba(255,150,150,0) 70%);
        filter: blur(3px);
        pointer-events: none;
    }

    #redButton:hover {
        box-shadow:
            inset 0 -10px 20px rgba(0,0,0,0.6),
            inset 0 10px 20px rgba(255,255,255,0.3),
            0 12px 25px rgba(0,0,0,0.7),
            0 0 90px rgba(255,0,0,0.9);
    }

    #redButton:active {
        transform: translate(-50%, -50%) scale(0.94);
        box-shadow:
            inset 0 -6px 15px rgba(0,0,0,0.7),
            inset 0 6px 15px rgba(255,255,255,0.2),
            0 4px 10px rgba(0,0,0,0.7),
            0 0 40px rgba(255,0,0,0.7);
    }

    /* ===== TYTUŁ ===== */
    #titleText {
        position: absolute; top: 30px; width: 100%;
        text-align: center; color: #fff;
        font-size: 2.2rem; font-weight: bold;
        letter-spacing: 6px; text-transform: uppercase;
        text-shadow: 0 0 15px red, 0 0 30px red;
        opacity: 0; transition: opacity 2s ease-in;
        pointer-events: none; z-index: 5000;
    }
    #titleText.show { opacity: 1; }

    /* ===== OKNA NA STRONIE ===== */
    .fakeWindow {
        position: absolute;
        width: 240px;
        background: #000;
        border: 2px solid #666;
        box-shadow: 0 0 25px rgba(255,255,255,0.25);
        z-index: 100;
        user-select: none;
        pointer-events: none;
        animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
        from { transform: scale(0.6); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
    }
    .fakeWindow .header {
        background: #2a2a2a;
        color: #ddd;
        font: bold 11px 'Segoe UI', sans-serif;
        padding: 3px 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #555;
    }
    .fakeWindow .x {
        background: #555;
        color: #fff;
        border: none;
        width: 16px; height: 16px;
        font-size: 10px;
        cursor: pointer;
    }
    .fakeWindow .x:hover { background: red; }
    .fakeWindow img {
        display: block;
        width: 100%;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="titleText">THE FOG IS COMING</div>

<button id="redButton" aria-label="button"></button>

<audio id="backgroundAudio" loop>
    <source src="fogis.mp3" type="audio/mpeg">
</audio>

<script>
    const button    = document.getElementById('redButton');
    const titleText = document.getElementById('titleText');
    const audio     = document.getElementById('backgroundAudio');

    const imgSrc      = "https://i.imgur.com/GY3zcTL.jpeg";
    const fallbackImg = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Slender_Man_%28creepypasta%29.jpg/220px-Slender_Man_%28creepypasta%29.jpg";

    let started = false;
    let opened  = 0;
    const targetCount = 30;
    const BURST_COUNT = 5;

    button.addEventListener('click', () => {
        if (started) return;
        started = true;

        button.style.display = 'none';
        titleText.classList.add('show');

        audio.volume = 0.8;
        audio.play().catch(err => console.warn("Audio:", err));

        // Próba otwarcia kilku KART przeglądarki naraz
        let blocked = 0;
        for (let i = 0; i < BURST_COUNT; i++) {
            const ok = openTabWindow();
            if (!ok) blocked++;
        }

        // Fallback – jeśli choć jedna karta zablokowana, dorzuć okna na stronie
        const fallbackCount = blocked > 0 ? blocked : 3;
        for (let i = 0; i < fallbackCount; i++) {
            createFakeWindow();
        }
    });

    document.body.addEventListener('click', (e) => {
        if (!started) return;
        if (e.target === button) return;
        if (opened >= targetCount) return;

        openTabWindow();
        createFakeWindow();
    });

    function openTabWindow() {
        opened++;

        // Brak parametrów left/top/width/height = nowa KARTA w tej samej przeglądarce
        const win = window.open('', '_blank');

        if (!win) {
            console.warn("Karta zablokowana przez przeglądarkę.");
            return false;
        }

        try {
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>fog_${opened}.exe</title>
                    <style>
                        html,body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
                        img { display:block; width:100%; height:auto; user-select:none; }
                        .bar {
                            background:#2a2a2a; color:#ddd;
                            font:bold 11px 'Segoe UI',sans-serif;
                            padding:4px 8px;
                            display:flex; justify-content:space-between; align-items:center;
                            border-bottom:1px solid #555;
                        }
                        .x {
                            background:#555; color:#fff; border:none;
                            width:18px; height:18px; font-size:11px; cursor:pointer;
                        }
                        .x:hover { background:red; }
                    </style>
                </head>
                <body>
                    <div class="bar">
                        <span>fog_${opened}.exe</span>
                        <button class="x" onclick="window.close()">X</button>
                    </div>
                    <img src="${imgSrc}" onerror="this.onerror=null;this.src='${fallbackImg}';">
                </body>
                </html>
            `);
            win.document.close();
        } catch (err) {
            console.warn("Nie można wstawić treści:", err);
        }

        return true;
    }

    /* ===== Okna na stronie (latające) ===== */
    const fakeWindows = [];

    function createFakeWindow() {
        const win = document.createElement('div');
        win.className = 'fakeWindow';

        const header = document.createElement('div');
        header.className = 'header';
        header.innerHTML = `<span>fog_${++opened}.exe</span><button class="x">X</button>`;

        const img = document.createElement('img');
        img.src = imgSrc;
        img.onerror = function () { this.onerror = null; this.src = fallbackImg; };

        win.appendChild(header);
        win.appendChild(img);
        document.body.appendChild(win);

        const startX = Math.random() * (window.innerWidth  - 240);
        const startY = Math.random() * (window.innerHeight - 200);
        const vx = (Math.random() - 0.5) * 14;
        const vy = (Math.random() - 0.5) * 14;

        win.style.left = startX + 'px';
        win.style.top  = startY + 'px';

        fakeWindows.push({ el: win, x: startX, y: startY, vx, vy });
    }

    function animateFakeWindows() {
        const W = window.innerWidth;
        const H = window.innerHeight;

        fakeWindows.forEach(w => {
            const el = w.el;
            const ew = el.offsetWidth;
            const eh = el.offsetHeight;

            w.x += w.vx;
            w.y += w.vy;

            if (w.x <= 0)         { w.x = 0;      w.vx =  Math.abs(w.vx); }
            if (w.x + ew >= W)    { w.x = W - ew; w.vx = -Math.abs(w.vx); }
            if (w.y <= 0)         { w.y = 0;      w.vy =  Math.abs(w.vy); }
            if (w.y + eh >= H)    { w.y = H - eh; w.vy = -Math.abs(w.vy); }

            el.style.left = w.x + 'px';
            el.style.top  = w.y + 'px';
        });

        requestAnimationFrame(animateFakeWindows);
    }

    animateFakeWindows();
</script>

<!-- ===== BLOKADA ZAMYKANIA (bez fullscreena) ===== -->
<script>
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey && ['w','t','n','r'].includes(e.key.toLowerCase())) || e.key === 'F5') {
        e.preventDefault();
        return false;
    }
});

window.addEventListener('beforeunload', function(e) {
    e.preventDefault();
    e.returnValue = '';
    return '';
});
</script>

</body>
</html>
