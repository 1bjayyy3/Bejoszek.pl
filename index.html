<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bejoszekpl</title>
<style>
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: black; overflow: hidden;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        cursor: crosshair;
    }

    #redButton {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 160px; height: 160px;
        background: radial-gradient(circle at 30% 30%, #ff2222, #8b0000);
        border: 4px solid #500; border-radius: 50%;
        color: white; font-size: 16px; font-weight: bold;
        letter-spacing: 2px; text-transform: lowercase;
        cursor: pointer;
        box-shadow: 0 0 40px rgba(255,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
        transition: transform 0.15s, box-shadow 0.2s;
        z-index: 9999; outline: none;
    }

    #redButton:hover {
        box-shadow: 0 0 70px rgba(255,0,0,1), inset 0 0 20px rgba(0,0,0,0.5);
    }

    #redButton:active {
        transform: translate(-50%, -50%) scale(0.92);
    }

    #titleText {
        position: absolute; top: 30px; width: 100%;
        text-align: center; color: #fff;
        font-size: 2.2rem; font-weight: bold;
        letter-spacing: 6px; text-transform: uppercase;
        text-shadow: 0 0 15px red, 0 0 30px red;
        opacity: 0; transition: opacity 2s ease-in;
        pointer-events: none; z-index: 5000;
    }

    #titleText.show { opacity: 1; }

    #hint {
        position: absolute; bottom: 20px; width: 100%;
        text-align: center; color: #ff4444;
        font-size: 14px; letter-spacing: 2px;
        opacity: 0; transition: opacity 0.5s;
        z-index: 5000; pointer-events: none;
        text-shadow: 0 0 8px red;
    }

    #hint.show { opacity: 1; }
</style>
</head>

<body>

<div id="titleText">THE FOG IS COMING</div>
<div id="hint">KLIKAJ, ABY OTWORZYĆ WIĘCEJ OKIEN...</div>

<!-- ZMIENIONY NAPIS NA PRZYCISKU -->
<button id="redButton">kliknij mnie</button>

<audio id="backgroundAudio" loop>
    <source src="fogis.mp3" type="audio/mpeg">
</audio>

<script>
    const button = document.getElementById('redButton');
    const titleText = document.getElementById('titleText');
    const hint = document.getElementById('hint');
    const audio = document.getElementById('backgroundAudio');

    const imgSrc = "https://i.imgur.com/GY3zcTL.jpeg";
    const fallbackImg = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Slender_Man_%28creepypasta%29.jpg/220px-Slender_Man_%28creepypasta%29.jpg";

    let started = false;
    let opened = 0;
    const targetCount = 30;

    button.addEventListener('click', () => {
        if (started) return;
        started = true;

        button.style.display = 'none';
        titleText.classList.add('show');
        hint.classList.add('show');

        audio.volume = 0.8;
        audio.play().catch(error => {
            console.warn("Nie udało się odtworzyć dźwięku:", error);
        });

        openOneWindow();
    });

    document.body.addEventListener('click', (e) => {
        if (!started) return;
        if (e.target === button) return;
        if (opened >= targetCount) return;
        openOneWindow();
    });

    function openOneWindow() {
        opened++;
        const w = 260, h = 220;

        const x = Math.floor(Math.random() * Math.max(0, screen.width - w));
        const y = Math.floor(Math.random() * Math.max(0, screen.height - h));

        const win = window.open(
            '',
            '_blank',
            `width=${w},height=${h},left=${x},top=${y},menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=no`
        );

        if (!win) {
            console.warn("Popup zablokowany – zezwól na wyskakujące okienka dla tej strony.");
            return;
        }

        try {
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>fog_${opened}.exe</title>
                    <style>
                        html,body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; cursor:crosshair; }
                        img { display:block; width:100%; height:auto; pointer-events:none; user-select:none; }
                        .bar {
                            background:#2a2a2a; color:#ddd;
                            font:bold 11px 'Segoe UI',sans-serif;
                            padding:3px 6px; border-bottom:1px solid #555;
                            display:flex; justify-content:space-between; align-items:center;
                        }
                        .x { background:#555; color:#fff; border:none; width:16px; height:16px; font-size:10px; cursor:pointer; }
                        .x:hover { background:red; }
                    </style>
                </head>
                <body>
                    <div class="bar">
                        <span>fog_${opened}.exe</span>
                        <button class="x" onclick="window.close()">X</button>
                    </div>
                    <img src="${imgSrc}" onerror="this.onerror=null;this.src='${fallbackImg}';">
                </body>
                </html>
            `);
            win.document.close();
        } catch (err) {
            console.warn("Nie można wstawić treści do okna:", err);
        }

        startFloating(win, w, h);

        if (opened >= targetCount) {
            hint.textContent = "KONIEC. NIE MA UCIECZKI.";
        }
    }

    function startFloating(win, w, h) {
        let vx = (Math.random() - 0.5) * 40;
        let vy = (Math.random() - 0.5) * 40;
        let x = win.screenX || 0;
        let y = win.screenY || 0;

        const maxX = (screen.availWidth || screen.width) - w;
        const maxY = (screen.availHeight || screen.height) - h;

        function tick() {
            if (win.closed) return;
            x += vx; y += vy;

            if (x <= 0) { x = 0; vx = Math.abs(vx); }
            if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }
            if (y <= 0) { y = 0; vy = Math.abs(vy); }
            if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }

            try { win.moveTo(x, y); } catch (e) {}

            setTimeout(tick, 10);
        }
        tick();
        <script>
// 1. Blokada prawego przycisku
document.addEventListener('contextmenu', e => e.preventDefault());

// 2. Blokada skrótów klawiszowych
document.addEventListener('keydown', function(e) {
    if (
        (e.ctrlKey && ['w','t','n','r'].includes(e.key.toLowerCase())) ||
        e.key === 'F5'
    ) {
        e.preventDefault();
        return false;
    }
});

// 3. Pytanie przy próbie zamknięcia
window.addEventListener('beforeunload', function(e) {
    e.preventDefault();
    e.returnValue = '';
    return '';
});

// 4. Otwieranie nowego okna przy zamknięciu (opcjonalne – ryzykowne!)
// window.addEventListener('beforeunload', function() {
//     window.open(location.href, '_blank');
// });

// 5. Pełny ekran po kliknięciu
document.body.addEventListener('click', function() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
    }
</script>

</body>
</html>
